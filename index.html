<style>

:root{
--main:#173b6c;
--main-light:#2f5da0;
--gray:#eef2f6;
--gray-text:#7b8794;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(180deg,#f8fafc,#eef2f6);
min-height:100vh;
}

/* HEADER */

header{
text-align:center;
padding:35px 15px 25px;
}

.logo{
width:260px;
max-width:90%;
}

.title{
font-size:30px;
font-weight:800;
letter-spacing:2px;
color:var(--main);
margin-top:10px;
}

header p{
margin-top:8px;
font-size:15px;
font-weight:600;
color:var(--gray-text);
}

header::after{
content:"";
display:block;
width:90px;
height:4px;
margin:15px auto 0;
border-radius:50px;
background:linear-gradient(90deg,var(--main-light),var(--main));
}

/* GRID */

.container{
width:94%;
max-width:1300px;
margin:auto;
padding:25px 0 50px;

display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

/* CARD */

.card{
text-decoration:none;
overflow:hidden;
position:relative;

border-radius:24px;

background:rgba(255,255,255,.9);

border:1px solid rgba(23,59,108,.08);

box-shadow:
0 10px 25px rgba(23,59,108,.08),
0 3px 10px rgba(0,0,0,.04);

transition:.4s ease;
}

.card::before{
content:"";
position:absolute;
top:0;
right:0;
width:100%;
height:5px;
background:linear-gradient(
90deg,
var(--main-light),
var(--main)
);
z-index:2;
}

/* تأثير لمعان */

.card::after{
content:"";
position:absolute;
top:-100%;
left:-120%;
width:70%;
height:300%;

background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,.5),
transparent
);

transform:rotate(25deg);
transition:.8s;
}

.card:hover::after{
left:150%;
}

.card:hover{
transform:translateY(-8px);
box-shadow:
0 20px 40px rgba(23,59,108,.15);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
transition:.5s;
}

.card:hover img{
transform:scale(1.08);
}

.card h2{
padding:14px 10px;
text-align:center;
font-size:15px;
font-weight:700;
background:white;
color:var(--main);
}

/* ظهور ناعم */

.card{
animation:show .5s ease;
}

@keyframes show{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* WhatsApp */

.whatsapp{
position:fixed;
left:20px;
bottom:20px;

width:62px;
height:62px;

border-radius:50%;

background:#25D366;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
text-decoration:none;

box-shadow:
0 8px 20px rgba(0,0,0,.2);

transition:.3s;

z-index:999;
}

.whatsapp:hover{
transform:scale(1.1);
}

/* Tablet */

@media(max-width:900px){

.container{
grid-template-columns:repeat(3,1fr);
}

}

/* Mobile */

@media(max-width:768px){

.logo{
width:210px;
}

.title{
font-size:24px;
}

.container{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card{
border-radius:18px;
}

.card img{
height:145px;
}

.card h2{
font-size:13px;
padding:10px 5px;
}

.whatsapp{
width:55px;
height:55px;
font-size:24px;
}

}

</style>
</head>
