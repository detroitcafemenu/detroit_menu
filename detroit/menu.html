
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Menu</title>

<style>
body{font-family:cairo;background:#f5f5f5}
.container{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:20px}
.card{background:white;padding:10px;border-radius:10px;text-align:center}
.name{font-weight:bold}
.price{color:#555}
</style>
</head>

<body>

<h2 style="text-align:center">🍽️ المنيو</h2>

<div class="container" id="menu"></div>

<script>
function loadMenu(){
  fetch("get_menu.php")
  .then(res=>res.json())
  .then(data=>{

    let html="";

    data.forEach(item=>{
      html+=`
        <div class="card">
          <div class="name">${item.name}</div>
          <div class="price">${item.price}</div>
        </div>
      `;
    });

    menu.innerHTML=html;
  });
}

loadMenu();
</script>

</body>
</html>
